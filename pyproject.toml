[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-variable-discovery"
version = "0.3.0"
description = "Learn calibrated, sampling-aware latent descriptors from grouped scientific data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "sympy>=1.12",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
kan = ["pykan>=0.2"]
dev = ["pytest>=8.0"]

[project.scripts]
lvs-workflow      = "lvs.workflows.single:main"
lvs-batch         = "lvs.workflows.batch:main"
lvs-expression-q  = "lvs.workflows.expression_latent_q:main"
lvs-torch         = "lvs.backends.torch_mlp:main"

[tool.setuptools.packages.find]
include = ["lvs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
